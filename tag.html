<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://www.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://*.googleusercontent.com; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Report a problem · Pinky's Rentals</title>
<meta name="theme-color" content="#ff2d8c">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.min.css">
<style>
  body { background: var(--bg); }
  .wrap { max-width: 460px; margin: 0 auto; padding: 1.2rem 1rem 3rem; }
  .logo { display: block; width: 160px; margin: .5rem auto 1rem; border-radius: 12px; background: #eaeaea; padding: 4px; }
  .code { font-size: 2rem; letter-spacing: .4em; text-align: center; font-family: ui-monospace, Menlo, monospace; }
  .choice { display: block; width: 100%; text-align: left; padding: .9rem 1rem; margin-bottom: .6rem; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
  .choice.active { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255,45,140,.2); }
  .choice b { display: block; }
  .choice.primary { padding: 1.6rem 1.2rem; margin: .4rem 0 1rem; border: 2px solid var(--pink); background: linear-gradient(180deg, rgba(255,45,140,.14), rgba(255,45,140,.04)); box-shadow: 0 0 14px rgba(255,45,140,.55), 0 0 40px rgba(255,45,140,.25), inset 0 0 18px rgba(255,45,140,.08); animation: glow 2.2s ease-in-out infinite alternate; }
  .choice.primary b { font-size: 1.55rem; margin-bottom: .25rem; }
  .choice.primary span { font-size: 1rem; }
  .choice.secondary { opacity: .8; }
  @keyframes glow { from { box-shadow: 0 0 10px rgba(255,45,140,.45), 0 0 30px rgba(255,45,140,.2); } to { box-shadow: 0 0 20px rgba(255,45,140,.8), 0 0 56px rgba(255,45,140,.35); } }
  @media (prefers-reduced-motion: reduce) { .choice.primary { animation: none; } }
  .machine-id { display: flex; align-items: center; gap: .9rem; padding: .7rem .9rem; }
  .tag.big { font-size: 1.5rem; padding: .3rem .6rem; }
  h2.center { margin-top: .4rem; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading"><span class="spinner"></span></div></div>
